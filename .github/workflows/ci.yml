name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_PASSWORD: postgres
          # CI only: the per-school roles have no password (locally they use peer auth).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Demo database (schema, 90 days of data, one role per school)
        run: |
          psql -c "CREATE DATABASE cantina_demo"
          uv run cantina-demo-seed
      - run: uv run pytest -q
