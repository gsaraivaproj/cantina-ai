[project]
name = "cantina-ai"
version = "0.1.0"
description = "AI over a school cafeteria system: MCP tools, RAG, guarded text-to-SQL and LLM evaluation"
authors = [{ name = "Guilherme Saraiva", email = "43341704+gsaraivaproj@users.noreply.github.com" }]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.14.0",
    "mcp>=2.3.0",
    "pathspec>=1.1.1",
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
cantina-demo-seed = "cantina_ai.demo.seed:main"
cantina-demo-roles = "cantina_ai.demo.access:roles_main"
cantina-demo-index = "cantina_ai.demo.index_docs:main"
cantina-mcp = "cantina_ai.demo.server:main"
cantina-demo-eval = "cantina_ai.demo.cases:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pyright>=1.1.414", "pytest>=9.1.1", "ruff>=0.17.1"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The semantic notes are prose sent to the model.
"src/cantina_ai/demo/access.py" = ["E501"]

[tool.pyright]
typeCheckingMode = "standard"
